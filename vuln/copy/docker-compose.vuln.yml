version: '3.8'

services:
  flask-api-vuln:
    build:
      context: ./vuln
      dockerfile: Dockerfile
    container_name: flask-api-vuln
    ports:
      - "5001:5001"
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - .vuln/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - monitoring
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - monitoring
    restart: unless-stopped

  # grafana:
    # image: grafana/grafana:latest
    # container_name: grafana
    # ports:
      # - "3000:3000"
    # volumes:
      # - grafana-data:/var/lib/grafana
    # depends_on:
      # - prometheus
    # networks:
      # - monitoring
    # restart: unless-stopped

networks:
  monitoring:
    external: true

volumes:
  grafana-data:
