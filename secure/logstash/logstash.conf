input {
  file {
    path => "/logs/api_logger.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "api_log"
  }

  file {
    path => "/logs/rate_limit.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "rate_limit_log"
  }
}

filter {
  if [type] == "api_log" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} - %{LOGLEVEL:level} - %{DATA:logger} - %{IP:client_ip} \| %{WORD:method} %{URIPATH:uri}(?: \| Status: %{NUMBER:status})? \| Time: %{NUMBER:response_time:float}s \| User-Agent: %{DATA:user_agent} \| User: %{DATA:user}"
      }
    }
    date {
      match => ["timestamp", "ISO8601"]
    }
  }

  if [type] == "rate_limit_log" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} - %{LOGLEVEL:level} - %{DATA:logger} - %{GREEDYDATA:details}"
      }
    }
    date {
      match => ["timestamp", "ISO8601"]
    }
  }
}

output {
  if [type] == "api_log" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "api-logs"
    }
  }

  if [type] == "rate_limit_log" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "rate-limit-logs"
    }
  }

  stdout { codec => rubydebug }
}
